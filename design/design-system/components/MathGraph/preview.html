<!-- @dsCard group="Tuteur" height=300 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { width: 318 } }, h(T.MathGraph, { subject: 'maths', xRange: [-1, 7.4], yRange: [-2, 26], focus: 0, pointLegend: 'Solution',
  lines: [{ m: 3, b: 5, from: 0, to: 7, label: 'y = 3x + 5' }, { m: 0, b: 20, from: 0, dashed: true, color: 'var(--blue-500)', label: 'y = 20' }],
  points: [{ x: 0, y: 5 }, { x: 5, y: 20, key: true, pulse: true, guide: true, label: 'x = 5' }], description: 'Droite y = 3x + 5 et droite y = 20 qui se croisent en x = 5.' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
