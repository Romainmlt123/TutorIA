<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { width: 318 } }, h(T.MathGraph, { subject: 'maths', xRange: [-3, 4], yRange: [-3, 7],
  lines: [{ m: 2, b: 1, label: 'y = 2x + 1' }, { m: -1, b: 4, dashed: true, color: 'var(--blue-500)', label: 'y = −x + 4' }],
  points: [{ x: 1, y: 3, pulse: true, guide: true, label: '(1 ; 3)' }], description: 'Deux droites qui se coupent en (1 ; 3).' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
