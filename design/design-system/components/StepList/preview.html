<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, padding: 20, boxSizing: 'border-box', background: 'var(--surface)', borderRadius: 24 } }, h(T.StepList, { tone: 'parents', icon: 'phone', plain: true, title: 'Sur le téléphone de Léa', steps: ['Installez Tutor’IA et ouvrez l’app.', 'Léa crée son compte élève, ou se connecte si elle en a déjà un.', 'Elle touche «\u00a0J’ai un code de mon parent\u00a0» et saisit ce code.'] }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
