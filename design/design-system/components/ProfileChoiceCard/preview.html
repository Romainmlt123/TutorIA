<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
function Demo() { var w = React.useState('eleve');
  return h('div', { style: { width: 350, display: 'flex', flexDirection: 'column', gap: 12 } },
    h(T.ProfileChoiceCard, { role: 'eleve', selected: w[0] === 'eleve', onClick: function () { w[1]('eleve'); } }),
    h(T.ProfileChoiceCard, { role: 'parent', selected: w[0] === 'parent', onClick: function () { w[1]('parent'); } })); }
return h(Demo);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
