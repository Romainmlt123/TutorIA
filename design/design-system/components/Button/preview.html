<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12 } },
    h(T.Button, { brand: true, iconRight: 'arrowRight' }, 'Reprendre'),
    h(T.Button, { variant: 'vivid', brand: true, iconRight: 'arrowRight' }, "C'est parti"),
    h(T.Button, { variant: 'soft', icon: 'retry' }, 'Recommencer'),
    h(T.Button, { variant: 'ghost' }, 'Plus tard')),
  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, padding: 16, borderRadius: 24, background: 'var(--blue-600)' } },
    h(T.Button, { variant: 'white', size: 'sm' }, 'Voir le détail'),
    h(T.Button, { variant: 'danger', size: 'sm', icon: 'close' }, 'Raccrocher'),
    h(T.Button, { size: 'sm', disabled: true }, 'Vérifier ma réponse')));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
