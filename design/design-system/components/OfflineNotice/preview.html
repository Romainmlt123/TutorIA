<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, maxWidth: '100%', display: 'flex', flexDirection: 'column', gap: 12 } },
      h(T.ChatBubble, { from: 'student' }, 'Je divise par 3 ?'),
      h(T.OfflineNotice, { onRetry: function () {} }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
