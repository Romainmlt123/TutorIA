<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { display: 'flex', gap: 10 } }, h(T.LevelTypePill, { type: 'lecon' }), h(T.LevelTypePill, { type: 'exercices' }), h(T.LevelTypePill, { type: 'evaluation' }));

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
