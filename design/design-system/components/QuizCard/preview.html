<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 342, display: 'flex', flexDirection: 'column', gap: 24 } },
  h(T.QuizCard, { subject: 'maths', question: 'Résous 3x + 5 = 20', options: ['x = 3', 'x = 5', 'x = 15', 'x = 25'], answer: 1, picked: 1, explanation: '3x = 15, donc x = 15 ÷ 3 = 5.' }),
  h(T.QuizCard, { subject: 'maths', question: 'Résous 3x + 5 = 20', options: ['x = 3', 'x = 5', 'x = 15', 'x = 25'], answer: 1, picked: 2, explanation: '3x = 15, donc x = 15 ÷ 3 = 5.' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
