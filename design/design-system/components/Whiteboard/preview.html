<!-- @dsCard group="Tuteur" height=260 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
var tk = React.useState(0);
React.useEffect(function () { var id = setInterval(function () { tk[1](function (x) { return (x + 1) % 6; }); }, 1100); return function () { clearInterval(id); }; }, []);
return h('div', { style: { width: 318, padding: 12, background: 'var(--surface)', borderRadius: 16 } }, h(T.Whiteboard, { subject: 'maths', progress: Math.min(tk[0], 4), writing: tk[0] > 0 && tk[0] < 4,
  steps: [{ expr: '3x + 5 = 20', note: 'On retire 5' }, { expr: '3x = 15', op: '− 5', note: 'On divise par 3' }, { expr: 'x = 15 ÷ 3', op: '÷ 3' }], result: 'x = 5', resultNote: 'Solution',
  description: 'Résolution de 3x + 5 = 20 : on retire 5, on divise par 3, x = 5.' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
