<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { margin: -24 } }, h(T.LevelBackdrop, { height: 300, clouds: [[-30, 40, 150, 0.35], [250, 150, 150, 0.4]] }));

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
