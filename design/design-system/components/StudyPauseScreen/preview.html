<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, width: 366 } },
  h(T.StudyPauseScreen, { reason: 'evening', height: 560, style: { borderRadius: 24 } }),
  h(T.StudyPauseScreen, { reason: 'daily', time: '1 h 30', streak: 12, height: 760, style: { borderRadius: 24 } }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
