<!-- @dsCard group="Explorer" height=448 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { width: 460, borderRadius: 24, overflow: 'hidden' } },
  h(T.WorldMap, { height: 400, centerY: 240, amplitude: 40, initial: 'L', levels: [
  { id: 'n1', type: 'lecon', state: 'completed', stars: 3, title: 'Le repère' },
  { id: 'n2', type: 'exercices', state: 'completed', stars: 2, title: 'Placer des points' },
  { id: 'n3', type: 'lecon', state: 'active', title: 'Lire une abscisse' },
  { id: 'n4', type: 'exercices', state: 'locked', title: 'Coordonnées' },
  { id: 'n5', type: 'evaluation', state: 'locked', title: 'Évaluation du repère' }
],
    cities: [{ name: 'Repère-sur-Mer', status: 'current', startIndex: 0 }] }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
