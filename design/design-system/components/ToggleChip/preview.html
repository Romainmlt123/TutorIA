<!-- @dsCard group="Onboarding" height=100 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
function Demo() { var a = React.useState(true), b = React.useState(false);
  return h('div', { style: { width: 350, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 } },
    h(T.ToggleChip, { icon: 'clock', label: 'Après l’école', selected: a[0], onClick: function () { a[1](!a[0]); } }),
    h(T.ToggleChip, { icon: 'moon', label: 'Le soir', selected: b[0], onClick: function () { b[1](!b[0]); } })); }
return h(Demo);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
