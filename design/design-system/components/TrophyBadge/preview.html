<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h(T.WoodFrame, { ariaLabel: 'Médailles' }, h('div', { style: { display: 'flex', gap: 8 } },
  h(T.TrophyBadge, { icon: 'flame', tone: 'orange', label: '7 jours de suite' }),
  h(T.TrophyBadge, { icon: 'crown', tone: 'red', label: '1re évaluation réussie' }),
  h(T.TrophyBadge, { icon: 'star', tone: 'violet', label: '10 étoiles' }),
  h(T.TrophyBadge, { label: '30 jours de suite', locked: true })));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
