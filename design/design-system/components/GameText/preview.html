<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, padding: 20, boxSizing: 'border-box', borderRadius: 24, background: 'linear-gradient(180deg, #2F6FD0 0%, #8FC0F2 100%)', display: 'flex', flexDirection: 'column', gap: 10 } },
  h(T.GameText, { size: 32 }, 'Explorer'), h(T.GameText, { size: 17 }, 'Ville des Équations'), h(T.GameText, { size: 12, stroke: 2, drop: 0 }, '1re évaluation réussie'));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
