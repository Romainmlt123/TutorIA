<!-- @dsCard group="Stats" height=420 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, display: 'flex', flexDirection: 'column', gap: 16 } },
  h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 } },
    h(T.KpiCard, { tone: 'blue', icon: 'clock', label: 'Temps cette semaine', value: '3 h 20', delta: '+12 %' }),
    h(T.KpiCard, { tone: 'orange', icon: 'flame', label: 'Série', value: '12 j' })),
  h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 12 } },
    h(T.KpiCard, { tone: 'cyan', icon: 'clock', value: '4 h 40', label: 'd’étude', centered: true }),
    h(T.KpiCard, { tone: 'green', icon: 'calendar', value: '6 / 7', label: 'jours actifs', centered: true }),
    h(T.KpiCard, { tone: 'violet', icon: 'check', value: '3', label: 'notions acquises', centered: true })));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
