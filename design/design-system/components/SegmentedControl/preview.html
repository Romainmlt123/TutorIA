<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
function Demo() {
  var s = React.useState('semaine');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, width: 342 } },
    h(T.SegmentedControl, { fullWidth: true, label: 'Période', value: s[0], onChange: s[1], options: [{ id: 'semaine', label: 'Semaine' }, { id: 'mois', label: 'Mois' }, { id: 'trimestre', label: 'Trimestre' }] }),
    h(T.SegmentedControl, { label: 'Vue', value: 'liste', options: [{ id: 'liste', label: 'Liste', icon: 'sessions' }, { id: 'graph', label: 'Courbe', icon: 'trend' }] }));
}
return h(Demo);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
