<!-- @dsCard group="Compte" height=860 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, width: 350 } },
  h(T.PrivacyCard, { icon: 'eye', tone: 'violet', title: 'Ce que voient tes parents', items: [
    { kind: 'yes', text: 'Ton temps de travail' }, { kind: 'yes', text: 'Tes progrès par matière' }, { kind: 'yes', text: 'Un court résumé de chaque session' },
    { kind: 'no', text: 'Jamais tes conversations avec le tuteur' }, { kind: 'no', text: 'Jamais tes messages ni tes photos' }] }),
  h(T.PrivacyCard, { icon: 'bubble', tone: 'blue', title: 'Ce que garde le tuteur', items: [
    { icon: 'bubble', text: 'Tes messages', chip: '6 mois, puis effacés' },
    { icon: 'camera', text: 'Tes photos d’exercice', chip: 'Jamais enregistrées', chipTone: 'green' },
    { icon: 'mic', text: 'Ta voix', chip: 'Jamais enregistrée', chipTone: 'green' }] }),
  h(T.PrivacyCard, { icon: 'shield', tone: 'violet', title: 'Ce que nous gardons', chips: ['Prénom', 'Classe', 'Séances', 'Progression'], note: 'Aucune date de naissance, aucune adresse. Les conversations avec le tuteur ne vous sont jamais transmises.' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
