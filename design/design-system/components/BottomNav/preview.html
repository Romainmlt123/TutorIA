<!-- @dsCard group="Navigation" height=256 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
function Demo() {
  var a = React.useState('tuteur'), b = React.useState('progres');
  return h('div', { style: { width: 350, display: 'flex', flexDirection: 'column', gap: 40, paddingTop: 24 } },
    h(T.BottomNav, { space: 'eleve', active: a[0], onNavigate: a[1] }),
    h(T.BottomNav, { space: 'parents', active: b[0], onNavigate: b[1] }));
}
return h(Demo);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
