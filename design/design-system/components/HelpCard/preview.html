<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, display: 'flex', flexDirection: 'column', gap: 12 } },
  h(T.HelpCard, { icon: 'key', title: 'Où trouver ce code\u00a0?' }, 'Ton parent le crée dans son espace Tutor’IA, en ajoutant ton profil.'),
  h(T.HelpCard, { icon: 'family', tone: 'parents', title: 'Et après\u00a0?' }, 'Ton parent recevra un e-mail pour valider ton compte. En attendant, tu pourras déjà réviser avec tes flashcards.'));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
