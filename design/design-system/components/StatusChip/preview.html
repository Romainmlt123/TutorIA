<!-- @dsCard group="Fondations" height=80 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
var s = ['acquired','inProgress','toConsolidate','notStarted','understood','progressing','toReview'];
return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } }, s.map(function (x, i) { return h(T.StatusChip, { key: x, status: x, icon: i > 3 }); }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
