<!-- @dsCard group="Tuteur" height=144 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
function Demo() { var m = React.useState(false), c = React.useState(false);
  return h('div', { style: { width: 350 } }, h(T.CallControls, { muted: m[0], cameraOn: c[0], onToggleMute: function () { m[1](!m[0]); }, onToggleCamera: function () { c[1](!c[0]); } })); }
return h(Demo);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
