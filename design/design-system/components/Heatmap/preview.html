<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
var w = []; for (var i = 0; i < 8; i++) { var r = []; for (var j = 0; j < 7; j++) r.push((i * 7 + j * 3) % 5); w.push(r); }
return h('div', { style: { width: 342 } }, h(T.Heatmap, { weeks: w }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
