<!-- @dsCard group="Tuteur" height=288 -->
<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { width: 350, display: 'flex', flexDirection: 'column', gap: 12 } },
  h(T.ChatBubble, { from: 'tutor' }, 'On cherche x dans 3x + 5 = 20. Qu’est-ce qu’on enlève en premier des deux côtés ?'),
  h(T.ChatBubble, { from: 'student' }, 'Le 5 ?'),
  h(T.ChatBubble, { from: 'tutor' }, 'Propre ! Il reste 3x = 15. Tu vois la suite ?'));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
