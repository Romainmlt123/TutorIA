<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
  h(T.PasswordRules, { rules: [{ label: '8 caractères minimum', ok: true }, { label: 'Au moins un chiffre', ok: true }, { label: 'Au moins une majuscule', ok: false }] }),
  h(T.PasswordRules, { inline: true, rules: [{ label: '8 caractères', ok: true }, { label: 'Un chiffre', ok: true }, { label: 'Une majuscule', ok: false }] }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
