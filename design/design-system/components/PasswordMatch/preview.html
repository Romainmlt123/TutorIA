<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, padding: 20, boxSizing: 'border-box', background: 'var(--surface)', borderRadius: 24, display: 'flex', flexDirection: 'column', gap: 16 } },
  h(T.TextField, { label: 'Confirme le mot de passe', icon: 'lock', type: 'password', defaultValue: 'Soleil2026', filled: true }),
  h(T.PasswordMatch, { password: 'Soleil2026', confirm: 'Soleil2026' }),
  h(T.PasswordMatch, { password: 'Soleil2026', confirm: 'Soleil20' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
