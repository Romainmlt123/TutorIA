<div id="root" data-theme="light" style="padding:24px;background:var(--bg);font-family:var(--font-sans);color:var(--text);box-sizing:border-box;min-height:100vh"></div>
<script>
(function () {
  var h = React.createElement, T = window.TutorIA;
  function App() {
    return h('div', { style: { width: 350, maxWidth: '100%' } }, h(T.FeatureList, { tone: 'parents', title: 'Chaque semaine, vous verrez', items: [{ icon: 'star', text: 'Un résumé de sa semaine, rédigé par Tutor’IA' }, { icon: 'clock', text: 'Son temps d’étude et ses progrès par matière' }, { icon: 'bulb', text: 'Un conseil pour l’encourager' }], note: 'Jamais ses conversations avec le tuteur.' }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
