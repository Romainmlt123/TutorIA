<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant · Pastille d’état de l’appel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,0.7)}

</style>
</helmet>
<div style="display: inline-block; vertical-align: top; padding: {{ pad }}px; background: {{ fond }}; border-radius: 24px">
<span aria-live="polite" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 14px; box-sizing: border-box; border-radius: 999px; background: {{ bg }}; box-shadow: {{ shadow }}; color: #FFFFFF; font-family: Satoshi, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; white-space: nowrap; transition: box-shadow 0.3s">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ icon }}"></path></svg>
{{ label }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fond":{"editor":"color","options":["#1750C4","transparent"],"default":"#1750C4"},"etat":{"editor":"enum","options":["explique","ecoute","coupe","connexion","termine"],"default":"explique"},"couleurEcoute":{"editor":"enum","options":["rouge","orange"],"default":"rouge"},"$preview":{"width":232,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const MIC = 'M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3';
const VOICE = 'M11 5 6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14';
const DOTS = 'M5 12h.01M12 12h.01M19 12h.01';
const PHONE = 'M3 5a2 2 0 0 1 2-2h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 12l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5zM15 3l6 6M21 3l-6 6';
const etat = this.props.etat ?? 'explique';
const PILLS = {
explique: { bg: 'linear-gradient(160deg, #1BC85B 0%, #0C9E42 45%, #03702B 100%)', glow: 'rgba(3,112,43,0.45)' },
rouge: { bg: 'linear-gradient(160deg, #E95555 0%, #C21A1A 60%, #980B0B 100%)', glow: 'rgba(152,11,11,0.45)' },
orange: { bg: 'linear-gradient(160deg, #E9A951 0%, #D08825 50%, #A3640D 100%)', glow: 'rgba(163,100,13,0.45)' }
};
const key = etat === 'explique' ? 'explique' : (etat === 'ecoute' ? (this.props.couleurEcoute === 'orange' ? 'orange' : 'rouge') : null);
const LABELS = { explique: 'Je t’explique…', ecoute: 'Je t’écoute…', coupe: 'Ton micro est coupé', connexion: 'Connexion…', termine: 'Appel terminé' };
const ICONS = { explique: VOICE, ecoute: MIC, coupe: MIC + 'M4 4l16 16', connexion: DOTS, termine: PHONE };
const fond = this.props.fond ?? '#1750C4';
return {
fond, pad: fond === 'transparent' ? 0 : 16,
label: LABELS[etat] || LABELS.explique,
icon: ICONS[etat] || VOICE,
bg: key ? PILLS[key].bg : 'rgba(255,255,255,0.16)',
shadow: key ? '0 6px 18px ' + PILLS[key].glow + ', inset 0 0 0 1.5px rgba(255,255,255,0.28)' : 'none'
};
}
}
</script>
</body>
</html>
