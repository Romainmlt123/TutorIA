<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant · En-tête d’un visuel du tuteur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
body{margin:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.live{animation:blink 1.4s ease-in-out infinite}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(46,107,230,0.35)}
</style>
</helmet>
<div style="width: 322px; height: 48px; display: flex; align-items: center; gap: 8px; font-family: Satoshi, system-ui, -apple-system, sans-serif; color: #000612">
<button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-label="{{ toggleLabel }}" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0; border: none; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; font-family: inherit; color: inherit">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: {{ k.grad }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.icon }}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{ k.ink }}"><sc-if value="{{ live }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #E62E2E"></span></sc-if>{{ kicker }}</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ titre }}</span>
</span>
</button>
<button type="button" aria-label="{{ expandLabel }}" style="flex-shrink: 0; width: 48px; height: 48px; border: none; border-radius: 16px; background: #FFFFFF; color: #5D677D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
<button type="button" onClick="{{ toggle }}" aria-hidden="true" tabindex="-1" style="flex-shrink: 0; width: 48px; height: 48px; border: none; border-radius: 16px; background: #FFFFFF; color: #5D677D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ chevron }}deg); transition: transform 0.25s ease"><path d="M6 15l6-6 6 6"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"type": {"editor": "enum", "options": ["graphique", "tableau"], "default": "graphique"}, "titre": {"editor": "text", "default": "3x + 5 = 20"}, "kicker": {"editor": "text", "default": "Graphique · Maths"}, "live": {"editor": "boolean", "default": false}, "open": {"editor": "boolean", "default": true}, "onToggle": {"editor": null}, "$preview": {"width": 322, "height": 48}}'>
class Component extends DCLogic {
renderVals() {
const board = (this.props.type ?? 'graphique') === 'tableau';
const open = this.props.open ?? true;
const noun = board ? 'le tableau' : 'le graphique';
const k = board
? { grad: 'linear-gradient(160deg, #3F83FB 0%, #004BD0 100%)', ink: '#023CA3', icon: 'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5ZM15 5l4 4' }
: { grad: 'linear-gradient(160deg, #8558EA 0%, #521DC8 100%)', ink: '#3B0DA2', icon: 'M4 4v16h16M7 15l4-4 3 3 5-6' };
return {
k,
kicker: this.props.kicker ?? (board ? 'Tableau · Maths' : 'Graphique · Maths'),
titre: this.props.titre ?? '3x + 5 = 20',
live: !!this.props.live,
open,
chevron: open ? 0 : 180,
expandLabel: 'Agrandir ' + noun,
toggleLabel: (open ? 'Réduire ' : 'Afficher ') + noun,
toggle: () => { if (this.props.onToggle) this.props.onToggle(); }
};
}
}
</script>
</body>
</html>
