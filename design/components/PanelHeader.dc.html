<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant · En-tête du panneau visuel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
body{margin:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.live{animation:blink 1.4s ease-in-out infinite}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(46,107,230,0.35)}
</style>
</helmet>
<div style="width: 318px; height: 44px; display: flex; align-items: center; gap: 12px; font-family: Satoshi, system-ui, -apple-system, sans-serif; color: #000612">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(160deg, #E95555 0%, #C21A1A 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ icon }}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C21A1A">
<sc-if value="{{ live }}" hint-placeholder-val="{{ false }}"><span class="live" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #E62E2E"></span></sc-if>
{{ kicker }}
</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 700; white-space: nowrap">{{ titre }}</span>
</span>
<button type="button" aria-label="{{ expandLabel }}" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 14px; background: #F5F8FF; color: #5D677D; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg>
</button>
<button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-label="{{ toggleLabel }}" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 14px; background: #F5F8FF; color: #5D677D; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ chevron }}deg); transition: transform 0.25s ease"><path d="M6 15l6-6 6 6"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"type":{"editor":"enum","options":["graphique","tableau"],"default":"graphique"},"titre":{"editor":"text","default":"3x + 5 = 20"},"kicker":{"editor":"text","default":"Graphique · Maths"},"live":{"editor":"boolean","default":false},"open":{"editor":"boolean","default":true},"onToggle":{"editor":null},"$preview":{"width":318,"height":44}}'>
class Component extends DCLogic {
renderVals() {
const board = (this.props.type ?? 'graphique') === 'tableau';
const open = this.props.open ?? true;
const noun = board ? 'le tableau' : 'le graphique';
return {
icon: board ? 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' : 'M4 4v16h16M7 16l4-5 3 3 5-7',
kicker: this.props.kicker ?? (board ? 'Tableau · Maths' : 'Graphique · Maths'),
titre: this.props.titre ?? '3x + 5 = 20',
live: !!this.props.live,
open,
chevron: open ? 0 : 180,
expandLabel: 'Agrandir ' + noun,
toggleLabel: (open ? 'Réduire ' : 'Afficher ') + noun,
toggle: () => { if (this.props.onToggle) this.props.onToggle(); }
};
}
}
</script>
</body>
</html>
