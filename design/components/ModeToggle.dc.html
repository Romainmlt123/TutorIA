<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant · Bascule Écrit / Vocal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div style="width: 214px; height: 48px; display: flex; justify-content: center; font-family: Satoshi, system-ui, -apple-system, sans-serif; color: #000612">
<div role="group" aria-label="Mode de discussion" style="display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(9,17,34,0.06)">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
<a href="{{ m.href }}" aria-current="{{ m.current }}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 20px; background: {{ m.bg }}; color: {{ m.color }}; font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ m.icon }}"></path></svg>
{{ m.label }}
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["ecrit","vocal"],"default":"ecrit"},"variante":{"editor":"enum","options":["simple","graphique","tableau"],"default":"simple"},"$preview":{"width":214,"height":48}}'>
class Component extends DCLogic {
renderVals() {
const mode = this.props.mode ?? 'ecrit';
const v = this.props.variante ?? 'simple';
const suffix = v === 'graphique' ? '-Graphique' : (v === 'tableau' ? '-Tableau' : '');
const defs = [
{ id: 'ecrit', label: 'Écrit', href: '../screens/' + ({'':'02a','-Graphique':'02c','-Tableau':'02e'})[suffix] + '-Tuteur-Ecrit' + suffix + '.dc.html', icon: 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10' },
{ id: 'vocal', label: 'Vocal', href: '../screens/' + ({'':'02b','-Graphique':'02d','-Tableau':'02f'})[suffix] + '-Tuteur-Vocal' + suffix + '.dc.html', icon: 'M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3' }
];
const modes = defs.map((d) => {
const on = d.id === mode;
return { label: d.label, href: d.href, icon: d.icon, current: on ? 'page' : null, bg: on ? '#2E6BE6' : 'transparent', color: on ? '#FFFFFF' : '#5D677D' };
});
return { modes };
}
}
</script>
</body>
</html>
