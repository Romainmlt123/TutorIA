<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant · Carte sujet de discussion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div aria-label="Sujet de la discussion : {{ s.name }}, {{ titre }}" style="position: relative; overflow: hidden; width: 350px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: {{ s.grad }}; border-radius: 16px; box-shadow: 0 4px 16px rgba(9,17,34,0.06); font-family: Satoshi, system-ui, -apple-system, sans-serif; color: #FFFFFF">
<span aria-hidden="true" style="position: absolute; right: -14px; bottom: -14px; opacity: 0.16; display: flex"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ s.icon }}"></path></svg></span>
<span style="position: relative; flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.24); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.icon }}"></path></svg></span>
<span style="position: relative; flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{ s.name }}</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ titre }}</span>
</span>
<sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}"><span style="position: relative; flex-shrink: 0; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: {{ s.ink }}; font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap"><sc-if value="{{ live }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: #E62E2E"></span></sc-if>{{ badge }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"matiere": {"editor": "enum", "options": ["maths", "francais", "histoire-geo", "anglais", "svt", "physique-chimie", "toutes"], "default": "maths"}, "titre": {"editor": "text", "default": "Équations du 1er degré"}, "badge": {"editor": "text", "default": "Leçon 3/5"}, "live": {"editor": "boolean", "default": false}, "$preview": {"width": 350, "height": 64}}'>
class Component extends DCLogic {
renderVals() {
const S = {
'maths': { name: 'Maths', grad: 'linear-gradient(160deg, #E95555 0%, #C21A1A 45%, #980B0B 100%)', ink: '#C21A1A', icon: 'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01' },
'francais': { name: 'Français', grad: 'linear-gradient(160deg, #4D81EA 0%, #1750C4 45%, #0A3B9D 100%)', ink: '#1750C4', icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5' },
'histoire-geo': { name: 'Histoire-Géo', grad: 'linear-gradient(160deg, #1BC85B 0%, #0C9E42 45%, #03702B 100%)', ink: '#03702B', icon: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18' },
'anglais': { name: 'Anglais', grad: 'linear-gradient(160deg, #17A5BE 0%, #09879D 45%, #026273 100%)', ink: '#026273', icon: 'M4 5h9M8.5 3v2M11 5c-1 4-3.5 7-7 8.5M6 8.5c1.5 2.5 3.5 4 6 5M13 21l4-9 4 9M14.5 18h5' },
'svt': { name: 'SVT', grad: 'linear-gradient(160deg, #A3640D 0%, #6E4204 45%, #3D2400 100%)', ink: '#6E4204', icon: 'M5 19c0-8 5-14 15-15-1 10-7 15-15 15zM5 19l8-8' },
'physique-chimie': { name: 'Physique-Chimie', grad: 'linear-gradient(160deg, #8558EA 0%, #521DC8 45%, #3B0DA2 100%)', ink: '#521DC8', icon: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9' },
'toutes': { name: 'Toutes les matières', grad: 'linear-gradient(160deg, #4D81EA 0%, #1750C4 45%, #0A3B9D 100%)', ink: '#1750C4', icon: 'M4 5h16v11H9l-5 4z' }
};
const badge = this.props.badge ?? 'Leçon 3/5';
return {
s: S[this.props.matiere ?? 'maths'] || S.maths,
titre: this.props.titre ?? 'Équations du 1er degré',
badge,
hasBadge: !!badge,
live: !!this.props.live
};
}
}
</script>
</body>
</html>
