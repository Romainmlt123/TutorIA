:root{--bg:#F5F8FF;--surface:#FFFFFF;--text:#000612;--text-secondary:#5D677D;--text-disabled:#798398;--icon:#798398;--border:#CED4E2;--primary:#2E6BE6;--primary-hover:#1750C4;--primary-soft:#EBF1FF;--accent:#662EE6;--accent-soft:#F1EBFF;--success:#0C9E42;--success-strong:#03702B;--success-soft:#EBFFF2;--warning:#A3640D;--warning-strong:#6E4204;--warning-soft:#FFF7EB;--error:#E62E2E;--error-strong:#C21A1A;--radius-2xl:16px;--radius-3xl:24px;--shadow-sm:0 1px 2px rgba(9,17,34,0.06);--shadow-md:0 4px 16px rgba(9,17,34,0.06);--shadow-lg:0 12px 32px rgba(9,17,34,0.10);--shadow-brand:0 8px 20px rgba(46,107,230,0.25);--shadow-focus:0 0 0 3px rgba(46,107,230,0.35);--font-sans:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif}

<div style="display: flex; align-items: center; gap: 12px"><a href="#" aria-label="Retour" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--radius-2xl); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1750C4">Étape 1 sur 4</span><span aria-hidden="true" style="display: flex; gap: 6px"><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #2E6BE6"></span><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #B2C9F6"></span><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #B2C9F6"></span><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #B2C9F6"></span></span></div><a href="#" style="flex-shrink: 0; height: 48px; padding: 0 4px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--text-secondary); text-decoration: none">Passer</a></div><div style="display: flex; align-items: flex-end; gap: 10px"><img src="../../assets/logo/Logo_tutoria_fond_bleu.png" alt="Tutor'IA" width="40" height="40" style="flex-shrink: 0; display: block; width: 40px; height: 40px; border-radius: 999px; box-shadow: var(--shadow-sm)"><p style="margin: 0; padding: 12px 16px; border-radius: 20px 20px 20px 6px; background: var(--surface); box-shadow: var(--shadow-md); font-size: 15px; line-height: 22px; color: var(--text)">Salut Léa ! Je suis ton tuteur. Quatre petites questions et je m’adapte à toi.</p></div><header style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 900">Tu es en quelle classe&nbsp;?</h1><p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-secondary)">Je suis le programme officiel de ta classe.</p></header><div style="display: flex; flex-direction: column; gap: 16px"><sc-for list="{{ groups }}" as="gr" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary)">{{ gr.name }}</span><div role="radiogroup" aria-label="{{ gr.name }}" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ gr.items }}" as="g" hint-placeholder-count="4"><button type="button" role="radio" onClick="{{ g.pick }}" aria-checked="{{ g.on }}" style="min-width: 68px; height: 52px; padding: 0 16px; border: {{ g.border }}; box-sizing: border-box; border-radius: var(--radius-2xl); background: {{ g.bg }}; box-shadow: {{ g.shadow }}; color: {{ g.color }}; font-size: 16px; font-weight: 700; cursor: pointer">{{ g.label }}</button></sc-for></div></div></sc-for></div><div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px"><a href="O2-Onboarding-Matieres.dc.html" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: var(--radius-2xl); background: #2E6BE6; box-shadow: var(--shadow-brand); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Continuer<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { grade: '4e' }; }
renderVals() {
const g = this.state.grade;
const mk = (label) => ({ label, on: label === g, bg: label === g ? 'linear-gradient(160deg, #4D81EA 0%, #1750C4 60%, #0A3B9D 100%)' : '#FFFFFF',
color: label === g ? '#FFFFFF' : '#000612', border: label === g ? 'none' : '1px solid #CED4E2',
shadow: label === g ? 'var(--shadow-brand)' : 'var(--shadow-sm)', pick: () => this.setState({ grade: label }) });
return { groups: [["Primaire", ["CP", "CE1", "CE2", "CM1", "CM2"]], ["Collège", ["6e", "5e", "4e", "3e"]], ["Lycée", ["2de", "1re", "Tle"]]].map((x) => ({ name: x[0], items: x[1].map(mk) })) };
}
}
</script>
