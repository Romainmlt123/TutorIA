</form>
<div style="display: flex; flex-direction: column; gap: 14px">
<button type="button" role="checkbox" onClick="{{ tg_cgu }}" aria-checked="{{ ck_cgu }}" style="display: flex; align-items: flex-start; gap: 12px; padding: 0; border: none; background: transparent; text-align: left; cursor: pointer; color: var(--text)"><span style="flex-shrink: 0; width: 24px; height: 24px; margin-top: 1px; box-sizing: border-box; border-radius: 8px; border: {{ bd_cgu }}; background: {{ bx_cgu }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"></path></svg></span><span style="font-size: 14px; line-height: 22px">J'accepte les <a href="#" style="font-weight: 700; text-decoration: none">conditions d'utilisation</a> et la <a href="#" style="font-weight: 700; text-decoration: none">politique de confidentialité</a>.</span></button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { show: false, cgu: true, news: true }; }

togglePw() { this.setState({ show: !this.state.show }); }
pwVals() {
const s = this.state.show;
return { pwType: s ? 'text' : 'password', pwLabel: s ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
pwIcon: s ? 'M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2' : 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z', togglePw: () => this.togglePw() };
}
renderVals() {
const box = (k) => ({ ['tg_' + k]: () => this.setState({ [k]: !this.state[k] }), ['ck_' + k]: this.state[k], ['bd_' + k]: this.state[k] ? 'none' : '2px solid #CED4E2', ['bx_' + k]: this.state[k] ? '#662EE6' : '#FFFFFF' });
const rule = (ok, label) => ({ label, color: ok ? '#03702B' : '#5D677D', bg: ok ? '#0C9E42' : '#CED4E2' });
const rules = [rule(true, '8 caractères minimum'), rule(true, 'Au moins un chiffre'), rule(false, 'Au moins une majuscule')];
return Object.assign({ rules }, box('cgu'), box('news'), this.pwVals());
}
}
</script>
