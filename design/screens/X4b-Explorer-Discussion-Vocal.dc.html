<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tick: 0, muted: false, cam: false, interruptAt: -1000 }; }
componentDidMount() { this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 100); }
componentWillUnmount() { clearInterval(this.timer); }
renderVals() {
const tick = this.state.tick, t = tick * 0.1;
let m = tick - this.state.interruptAt < 50 ? 'user' : ((Math.floor(tick / 10) % 12) < 7 ? 'ai' : 'user');
if (m === 'user' && this.state.muted) m = 'muted';
const w = 36, max = 110;
const bars = [0, 1, 2, 3].map((i) => {
let h = w;
if (m === 'ai') { const env = 0.55 + 0.45 * Math.sin(t * 1.3 + i * 0.4); const wave = 0.5 + 0.5 * (0.6 * Math.sin(t * 7.1 + i * 1.7) + 0.4 * Math.sin(t * 3.3 + i * 2.9)); h = w + max * wave * env; }
else if (m === 'user') { h = w + max * 0.4 * (0.5 + 0.5 * Math.sin(t * 3.2 + i * 1.3)) * (0.6 + 0.4 * Math.sin(t * 0.9 + i)); }
return { h: Math.round(h) };
});
const labels = { ai: 'Le tuteur t’explique l’étape 2…', user: 'Le tuteur t’écoute…', muted: 'Ton micro est coupé' };
return { bars, status: labels[m], stageLabel: m === 'ai' ? 'Interrompre le tuteur' : 'Le tuteur t’écoute', muted: this.state.muted, camOn: this.state.cam,
interrupt: () => this.setState({ interruptAt: this.state.tick }),
toggleMute: () => this.setState({ muted: !this.state.muted }), toggleCam: () => this.setState({ cam: !this.state.cam }) };
}
}
</script>
