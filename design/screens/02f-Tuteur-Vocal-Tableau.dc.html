<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}

@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Black.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}
:root{--bg:#F5F8FF;--surface:#FFFFFF;--text:#000612;--text-secondary:#5D677D;--primary:#2E6BE6;--primary-soft:#EBF1FF;--accent:#662EE6;--error:#E62E2E;--error-strong:#C21A1A;--radius-2xl:16px;--radius-3xl:24px;--shadow-sm:0 1px 2px rgba(9,17,34,0.06);--shadow-md:0 4px 16px rgba(9,17,34,0.06);--shadow-lg:0 12px 32px rgba(9,17,34,0.10);--shadow-focus:0 0 0 3px rgba(46,107,230,0.35);--font-sans:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;font-family:var(--font-sans);background:#0A3B9D;color:#FFFFFF}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,0.7)}
@keyframes halo{0%{transform:scale(0.6);opacity:0.55}100%{transform:scale(2.2);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
@keyframes pen{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
.pen{display:inline-block;flex-shrink:0;width:8px;height:8px;border-radius:999px;background:#2E6BE6;box-shadow:0 0 0 3px rgba(46,107,230,.22);animation:pen 1s ease-in-out infinite;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.halo,.pen{animation:none}}
</style>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(170deg, #2E6BE6 0%, #1750C4 42%, #0A3B9D 78%, #03276E 100%); font-family: var(--font-sans); color: #FFFFFF">
<div style="position: absolute; top: 56px; left: 20px; right: 20px; height: 44px">
<dc-import name="../components/CallTopBar" fond="transparent" timer="{{ timer }}" ecrit-href="02e-Tuteur-Ecrit-Tableau.dc.html" hint-size="350px,44px"></dc-import>
</div>
<section aria-label="Tableau blanc du tuteur" style="position: absolute; top: 112px; left: 20px; right: 20px; height: 336px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #EBF2FF; border: 2px solid #B4CEFD; border-radius: 24px; box-shadow: 0 16px 36px rgba(3,39,110,0.35)">
<div style="display: flex; align-items: center; gap: 10px; height: 44px">
<span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(160deg, #3F83FB 0%, #004BD0 100%); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5ZM15 5l4 4"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #023CA3">Tableau · Maths</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 700; color: #000612; white-space: nowrap">3x + 5 = 20</span>
</div>
<button type="button" aria-label="Agrandir le tableau" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 14px; background: #FFFFFF; color: #5D677D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px; background: #FFFFFF; border-radius: 16px">
<div style="height: 230px; display: flex; flex-direction: column; justify-content: center">
<div role="img" aria-label="Tableau blanc écrit en direct : 3x + 5 = 20 ; on retire 5 des deux côtés : 3x = 15 ; on divise par 3 : x = 5, entouré." style="position: relative; display: flex; flex-direction: column; gap: 2px">
<sc-if value="{{ b.empty }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-size: 14px; line-height: 20px; font-weight: 500; color: #5D677D">Le tableau s’écrit pendant que le tuteur parle.</span></sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; transition: opacity 0.45s; opacity: {{ b.l1 }}">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif; font-size: 24px; line-height: 1.25; color: #000612; white-space: nowrap">3<i>x</i> + 5 = 20</span><span class="pen" style="opacity: {{ b.p1 }}"></span></span>
<span style="flex-shrink: 0; width: 118px; font-size: 12px; line-height: 16px; font-weight: 700; color: #000612">① On retire 5</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 12px; min-height: 24px; color: #2E6BE6; transition: opacity 0.45s; opacity: {{ b.o1 }}"><span style="font-size: 12px; font-weight: 700">↓</span><span style="font-family: 'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif; font-size: 17px; line-height: 1.2; white-space: nowrap">− 5</span><span class="pen" style="opacity: {{ b.p2 }}"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; transition: opacity 0.45s; opacity: {{ b.l2 }}">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif; font-size: 24px; line-height: 1.25; color: #000612; white-space: nowrap">3<i>x</i> = 15</span><span class="pen" style="opacity: {{ b.p3 }}"></span></span>
<span style="flex-shrink: 0; width: 118px; font-size: 12px; line-height: 16px; font-weight: 700; color: #000612">② On divise par 3</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 12px; min-height: 24px; color: #2E6BE6; transition: opacity 0.45s; opacity: {{ b.o2 }}"><span style="font-size: 12px; font-weight: 700">↓</span><span style="font-family: 'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif; font-size: 17px; line-height: 1.2; white-space: nowrap">÷ 3</span><span class="pen" style="opacity: {{ b.p4 }}"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; transition: opacity 0.45s; margin-top: 4px; opacity: {{ b.l3 }}">
<span style="display: flex; align-items: center; gap: 8px"><span style="padding: 0 14px; border-radius: 999px; border: 2.5px solid {{ b.ring }}; font-family: 'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif; font-size: 24px; line-height: 1.25; color: #000612; white-space: nowrap; color: #E62E2E; transition: border-color 0.6s"><i>x</i> = 5</span><span class="pen" style="opacity: {{ b.p5 }}"></span></span>
<span style="flex-shrink: 0; width: 118px; font-size: 12px; line-height: 16px; font-weight: 700; color: #000612">③ Solution</span>
</div>
</div>
</div>
</div>
</section>
<div style="position: absolute; left: 123px; top: 458px">
<dc-import name="../components/VoiceAvatar" fond="transparent" size="96" hop="{{ hop }}" tilt="{{ tilt }}" label="{{ avatarLabel }}" on-interrupt="{{ interrupt }}" hint-size="144px,128px"></dc-import>
</div>
<div style="position: absolute; top: 592px; left: 0; right: 0; display: flex; justify-content: center">
<dc-import name="../components/VoiceStatus" fond="transparent" etat="{{ statusEtat }}" couleur-ecoute="{{ couleurEcoute }}" hint-size="180px,40px"></dc-import>
</div>
<sc-if value="{{ showCaptions }}" hint-placeholder-val="{{ true }}">
<p aria-label="Sous-titres" style="position: absolute; top: 642px; left: 24px; right: 24px; height: 48px; margin: 0; overflow: hidden; text-align: center; font-size: 16px; line-height: 22px; text-wrap: pretty"><sc-for list="{{ words }}" as="w" hint-placeholder-count="10"><span style="color: {{ w.c }}; font-weight: {{ w.fw }}; background: {{ w.bg }}; padding: {{ w.pad }}; border-radius: 6px; transition: color 0.2s, background 0.2s">{{ w.t }}</span><span style="color: {{ w.c2 }}">{{ w.sp }}</span></sc-for></p>
</sc-if>
<div style="position: absolute; left: 20px; right: 20px; bottom: 32px">
<dc-import name="../components/CallDock" fond="transparent" muted="{{ muted }}" captions="{{ showCaptions }}" cam-on="{{ camOn }}" on-mute="{{ toggleMute }}" on-captions="{{ toggleCaptions }}" on-cam="{{ toggleCam }}" hangup-href="02e-Tuteur-Ecrit-Tableau.dc.html" hint-size="350px,112px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["auto","parle","ecoute"],"default":"auto"},"couleurEcoute":{"editor":"enum","options":["rouge","orange"],"default":"rouge"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tick: 0, offset: 12.0, muted: false, cam: false, captions: true };
this.SEGS = [{"who": "user", "text": "Tu peux me montrer comment résoudre 3x + 5 = 20 ?", "dur": 4}, {"who": "ai", "text": "On l’écrit au tableau. D’abord, on retire 5 des deux côtés.", "dur": 6.5}, {"who": "user", "text": "Ça donne 3x = 15.", "dur": 3}, {"who": "ai", "text": "Bravo ! Ensuite, on divise par 3 des deux côtés.", "dur": 5.5}, {"who": "user", "text": "Donc x = 5 !", "dur": 2.5}, {"who": "ai", "text": "Exactement, x = 5. J’entoure le résultat.", "dur": 5}];
}
componentDidMount() {
this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
pos() {
const etat = this.props.etat ?? 'auto';
if (etat === 'parle') return { i: 3, p: 0.7 + 0.0001 * (this.state.tick % 2) };
if (etat === 'ecoute') return { i: 2, p: 0.6 };
const total = this.SEGS.reduce((s, x) => s + x.dur, 0);
let t = (this.state.tick * 0.1 + this.state.offset) % total;
for (let i = 0; i < this.SEGS.length; i++) {
if (t < this.SEGS[i].dur) return { i, p: t / this.SEGS[i].dur };
t -= this.SEGS[i].dur;
}
return { i: 0, p: 0 };
}
renderVals() {
const t = this.state.tick * 0.1;
const { i, p } = this.pos();
const seg = this.SEGS[i];
const isAi = seg.who === 'ai';
const muted = this.state.muted;
const talking = p < 0.86;
const listeningMuted = !isAi && muted;
const list = seg.text.split(' ');
const shown = listeningMuted ? 0 : Math.ceil(Math.min(1, p / 0.86) * list.length);
// Rebond : niveau de la voix du tuteur (simulé ici), posé à chaque ponctuation.
const lastWord = list[Math.max(0, shown - 1)] || '';
const breath = /[.,!?:]$/.test(lastWord) ? 0.25 : 1;
const lively = (0.5 + 0.5 * Math.sin(t * 2.4)) * (0.6 + 0.4 * Math.sin(t * 0.9));
const hop = isAi && talking ? ((0.35 + 0.65 * lively) * breath).toFixed(2) : '0';
const tilt = !isAi && !muted ? '1' : '0';
const REVEAL = [[1, 0.12], [1, 0.62], [2, 0.35], [3, 0.55], [5, 0.12], [5, 0.55]];
const seen = REVEAL.map(([s, th]) => i > s || (i === s && p >= th));
let last = -1; seen.forEach((v, k) => { if (v && k < 5) last = k; });
const writing = last >= 0 && REVEAL[last][0] === i && p < 0.95;
const pen = (k) => (writing && last === k ? 1 : 0);
const b = {
l1: seen[0] ? 1 : 0, o1: seen[1] ? 1 : 0, l2: seen[2] ? 1 : 0, o2: seen[3] ? 1 : 0, l3: seen[4] ? 1 : 0,
ring: seen[5] ? '#E62E2E' : 'rgba(230,46,46,0)',
p1: pen(0), p2: pen(1), p3: pen(2), p4: pen(3), p5: pen(4) || (seen[5] && i === 5 && p < 0.8 ? 1 : 0),
empty: !seen[0]
};
const COL = ['#FFFFFF', 'rgba(255,255,255,0.45)'];
const words = listeningMuted
? [{ t: 'Réactive ton micro pour répondre.', c: COL[0], c2: COL[0], fw: 500, bg: 'transparent', pad: '0', sp: '' }]
: list.map((w, j) => {
const on = j < shown;
const tone = /^rouge/.test(w) ? '#E62E2E' : (/^bleue/.test(w) ? '#2E6BE6' : null);
const core = tone ? w.replace(/[,.]$/, '') : w;
const c = on ? COL[0] : COL[1];
return { t: core, sp: w.slice(core.length) + ' ', c: tone && on ? '#FFFFFF' : c, c2: c, fw: /[0-9=÷×]/.test(w) || tone ? 700 : 500, bg: tone && on ? tone : 'transparent', pad: tone ? '0 6px' : '0' };
});
const secs = 187 + Math.floor(this.state.tick / 10);
return {
hop, tilt, words, b, 
statusEtat: listeningMuted ? 'coupe' : (isAi ? 'explique' : 'ecoute'),
couleurEcoute: this.props.couleurEcoute ?? 'rouge',
speaker: isAi ? 'Tutor’IA' : 'Toi',
avatarLabel: isAi ? 'Interrompre Tutor’IA' : 'Tutor’IA t’écoute',
timer: String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'),
showCaptions: this.state.captions,
muted, camOn: this.state.cam,
interrupt: () => {
if ((this.props.etat ?? 'auto') !== 'auto' || !isAi) return;
this.setState({ offset: this.state.offset + (1 - p) * seg.dur });
},
toggleMute: () => this.setState({ muted: !this.state.muted }),
toggleCaptions: () => this.setState({ captions: !this.state.captions }),
toggleCam: () => this.setState({ cam: !this.state.cam })
};
}
}
</script>
</body>
