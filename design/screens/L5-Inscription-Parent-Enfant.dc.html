<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Black.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}
:root{--bg:#F5F8FF;--surface:#FFFFFF;--text:#000612;--text-secondary:#5D677D;--text-disabled:#798398;--icon:#798398;--border:#CED4E2;--primary:#2E6BE6;--primary-hover:#1750C4;--primary-soft:#EBF1FF;--accent:#662EE6;--accent-soft:#F1EBFF;--success:#0C9E42;--success-strong:#03702B;--success-soft:#EBFFF2;--warning:#A3640D;--warning-strong:#6E4204;--warning-soft:#FFF7EB;--error:#E62E2E;--error-strong:#C21A1A;--radius-2xl:16px;--radius-3xl:24px;--shadow-sm:0 1px 2px rgba(9,17,34,0.06);--shadow-md:0 4px 16px rgba(9,17,34,0.06);--shadow-lg:0 12px 32px rgba(9,17,34,0.10);--shadow-brand:0 8px 20px rgba(46,107,230,0.25);--shadow-focus:0 0 0 3px rgba(46,107,230,0.35);--font-sans:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;font-family:var(--font-sans);background:#F5F8FF;color:#000612}

button,input{font-family:inherit}
input::placeholder{color:#798398}
input:focus{outline:none;border-color:#2E6BE6;box-shadow:var(--shadow-focus)}
a:focus-visible,button:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); color: var(--text)">
<main style="display: flex; flex-direction: column; gap: 24px; padding: 56px 20px 32px; box-sizing: border-box; min-height: 844px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><a href="#" aria-label="Retour" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--radius-2xl); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #521DC8">Étape 2 sur 2</span><span aria-hidden="true" style="display: flex; gap: 6px"><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #662EE6"></span><span style="flex: 1 1 0; height: 8px; border-radius: 999px; background: #662EE6"></span></span></div>
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 900">Ajoutez votre enfant</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-secondary)">Tutor'IA adapte ses explications à sa classe.</p>
</header>
<sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
<form aria-label="Profil de l'enfant" style="display: flex; flex-direction: column; gap: 20px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; line-height: 20px; font-weight: 700">Prénom de votre enfant</span><span style="position: relative; display: block"><span style="position: absolute; left: 16px; top: 16px; color: #798398; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM4 21c1-4 4.5-6 8-6s7 2 8 6"></path></svg></span><input type="text" value="Léa" placeholder="Son prénom" style="width: 100%; height: 52px; padding: 0 16px 0 48px; box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-2xl); background: var(--surface); box-shadow: var(--shadow-sm); font-size: 16px; color: var(--text)"></span></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; line-height: 20px; font-weight: 700">Classe</span><div role="radiogroup" aria-label="Classe" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px"><sc-for list="{{ grades }}" as="g" hint-placeholder-count="12"><button type="button" role="radio" onClick="{{ g.pick }}" aria-checked="{{ g.on }}" style="height: 48px; border: {{ g.border }}; box-sizing: border-box; border-radius: var(--radius-2xl); background: {{ g.bg }}; box-shadow: {{ g.shadow }}; color: {{ g.color }}; font-size: 15px; font-weight: 700; cursor: pointer">{{ g.label }}</button></sc-for></div></div>
<button type="button" onClick="{{ create }}" style="width: 100%; height: 52px; border: none; border-radius: var(--radius-2xl); background: #662EE6; box-shadow: 0 8px 20px rgba(102,46,230,0.30); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">Créer le profil de Léa<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</form>
</sc-if>
<sc-if value="{{ created }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius-3xl); background: var(--surface); box-shadow: var(--shadow-md)">
<span style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 999px; background: linear-gradient(160deg, #E95555 0%, #C21A1A 60%, #980B0B 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900">L</span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 22px; font-weight: 900">Léa</span><span style="font-size: 13px; line-height: 18px; color: var(--text-secondary)">Classe de {{ grade }} · profil créé</span></span>
<button type="button" onClick="{{ edit }}" style="height: 40px; padding: 0 14px; border: none; border-radius: 12px; background: var(--primary-soft); color: var(--primary); font-size: 14px; font-weight: 700; cursor: pointer">Modifier</button>
</div>
<section aria-label="Code de connexion" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: var(--radius-3xl); background: linear-gradient(160deg, #8558EA 0%, #521DC8 60%, #3B0DA2 100%); color: #FFFFFF; box-shadow: var(--shadow-md)">
<svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: -30px; top: -34px; opacity: 0.14"><path d="M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7zM16 10h.01"></path></svg>
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9">Code de connexion de Léa</span>
<span style="font-size: 48px; line-height: 52px; font-weight: 900; letter-spacing: 0.12em">482 913</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; opacity: 0.92"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 7v5l3 2"></path></svg> Valable 24 h</span>
<a href="#" style="align-self: flex-start; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: #FFFFFF; color: #521DC8; font-size: 14px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg> Partager le code</a>
</section>
<section aria-label="Étapes sur l'appareil de l'enfant" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: var(--radius-3xl); background: var(--surface); box-shadow: var(--shadow-md)">
<h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 22px; font-weight: 900"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#521DC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2"></path></svg> Sur le téléphone de Léa</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px"><sc-for list="{{ steps }}" as="s" hint-placeholder-count="3"><li style="display: flex; align-items: center; gap: 12px"><span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 999px; background: #F1EBFF; color: #521DC8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900">{{ s.n }}</span><span style="font-size: 14px; line-height: 20px; color: #1C263B">{{ s.text }}</span></li></sc-for></ol>
</section>
<a href="#" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: var(--radius-2xl); background: #2E6BE6; box-shadow: var(--shadow-brand); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Accéder au tableau de bord<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { grade: '4e', created: false }; }
renderVals() {
const g = this.state.grade;
const grades = ["CP", "CE1", "CE2", "CM1", "CM2", "6e", "5e", "4e", "3e", "2de", "1re", "Tle"].map((label) => ({ label, on: label === g,
bg: label === g ? '#662EE6' : '#FFFFFF', color: label === g ? '#FFFFFF' : '#000612',
border: label === g ? 'none' : '1px solid #CED4E2', shadow: label === g ? '0 6px 14px rgba(102,46,230,0.25)' : 'var(--shadow-sm)',
pick: () => this.setState({ grade: label }) }));
const steps = [
{ n: '1', text: 'Installez Tutor’IA et ouvrez l’app.' },
{ n: '2', text: 'Choisissez « Je suis élève » et connectez-vous.' },
{ n: '3', text: 'Saisissez ce code dans le champ « Code parent ».' }
];
return { grades, grade: g, steps, editing: !this.state.created, created: this.state.created,
create: () => this.setState({ created: true }), edit: () => this.setState({ created: false }) };
}
}
</script>
</body>
