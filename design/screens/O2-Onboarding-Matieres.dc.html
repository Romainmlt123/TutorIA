<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lv: { maths: 1, francais: 2, 'histoire-geo': 2, 'physique-chimie': 0, svt: 3, anglais: 3 } }; }
renderVals() {
const LV = ["Galère", "Bof", "Ça va", "À l’aise"];
const S = [["maths", "Maths", "linear-gradient(160deg, #E95555 0%, #C21A1A 60%, #980B0B 100%)", "#C21A1A", "#FFEBEB", "M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"], ["francais", "Français", "linear-gradient(160deg, #4D81EA 0%, #1750C4 60%, #0A3B9D 100%)", "#1750C4", "#EBF1FF", "M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5"], ["histoire-geo", "Histoire-Géo", "linear-gradient(160deg, #1BC85B 0%, #0C9E42 45%, #03702B 100%)", "#03702B", "#EBFFF2", "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"], ["physique-chimie", "Physique-Chimie", "linear-gradient(160deg, #8558EA 0%, #521DC8 60%, #3B0DA2 100%)", "#521DC8", "#F1EBFF", "M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9"], ["svt", "SVT", "linear-gradient(160deg, #A3640D 0%, #6E4204 65%, #3D2400 100%)", "#6E4204", "#FFF7EB", "M5 19c0-8 5-14 15-15-1 10-7 15-15 15zM5 19l8-8"], ["anglais", "Anglais", "linear-gradient(160deg, #17A5BE 0%, #09879D 45%, #026273 100%)", "#026273", "#EBFCFF", "M4 5h9M8.5 3v2M11 5c-1 4-3.5 7-7 8.5M6 8.5c1.5 2.5 3.5 4 6 5M13 21l4-9 4 9M14.5 18h5"]];
const subjects = S.map(([id, name, grad, ink, soft, icon]) => {
const v = this.state.lv[id];
return { name, grad, ink, icon, label: LV[v],
levels: LV.map((label, i) => ({ label, on: v === i, aria: name + ' : ' + label,
bg: i === v ? grad : (i < v ? soft : '#F5F8FF'), color: i === v ? '#FFFFFF' : (i < v ? ink : '#5D677D'),
pick: () => this.setState({ lv: Object.assign({}, this.state.lv, { [id]: i }) }) })) };
});
return { subjects };
}
}
