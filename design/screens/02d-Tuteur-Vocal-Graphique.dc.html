<span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: {{ g.lgP }}; font-size: 12px; font-weight: 700; color: #C21A1A; transition: background 0.3s"><span aria-hidden="true" style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 999px; border: 2.5px solid #C21A1A; background: #FFFFFF"></span>Solution</span>

<div style="position: absolute; left: 123px; top: 458px">
<dc-import name="../components/VoiceAvatar" fond="transparent" size="96" hop="{{ hop }}" tilt="{{ tilt }}" label="{{ avatarLabel }}" on-interrupt="{{ interrupt }}" hint-size="144px,128px"></dc-import>

<div style="position: absolute; top: 592px; left: 0; right: 0; display: flex; justify-content: center">
<dc-import name="../components/VoiceStatus" fond="transparent" etat="{{ statusEtat }}" couleur-ecoute="{{ couleurEcoute }}" hint-size="180px,40px"></dc-import>
</div>

<p aria-label="Sous-titres" style="position: absolute; top: 642px; left: 24px; right: 24px; height: 48px; margin: 0; overflow: hidden; text-align: center; font-size: 16px; line-height: 22px; text-wrap: pretty"><sc-for list="{{ words }}" as="w" hint-placeholder-count="10"><span style="color: {{ w.c }}; font-weight: {{ w.fw }}; background: {{ w.bg }}; padding: {{ w.pad }}; border-radius: 6px; transition: color 0.2s, background 0.2s">{{ w.t }}</span><span style="color: {{ w.c2 }}">{{ w.sp }}</span></sc-for></p>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["auto","parle","ecoute"],"default":"auto"},"couleurEcoute":{"editor":"enum","options":["rouge","orange"],"default":"rouge"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tick: 0, offset: 4.0, muted: false, cam: false, captions: true };
this.SEGS = [{"who": "user", "text": "Je ne vois pas comment résoudre 3x + 5 = 20.", "dur": 4.5}, {"who": "ai", "text": "Regarde le graphique : la droite rouge, c’est y = 3x + 5.", "dur": 5.5, "focus": {"from": "rouge", "name": "rouge"}}, {"who": "ai", "text": "Et la droite bleue en pointillés, c’est y = 20.", "dur": 4.5, "focus": {"from": "bleue", "name": "bleu"}}, {"who": "user", "text": "Elles se croisent en x = 5 !", "dur": 3.5, "focus": {"from": "croisent", "name": "point"}}, {"who": "ai", "text": "Exactement ! Ce point, c’est la solution de l’équation.", "dur": 5.5, "focus": {"from": "point", "name": "point"}}];
}
componentDidMount() {
this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
pos() {
const etat = this.props.etat ?? 'auto';
if (etat === 'parle') return { i: 1, p: 0.8 + 0.0001 * (this.state.tick % 2) };
if (etat === 'ecoute') return { i: 3, p: 0.6 };
const total = this.SEGS.reduce((s, x) => s + x.dur, 0);
let t = (this.state.tick * 0.1 + this.state.offset) % total;
for (let i = 0; i < this.SEGS.length; i++) {
if (t < this.SEGS[i].dur) return { i, p: t / this.SEGS[i].dur };
t -= this.SEGS[i].dur;
}
return { i: 0, p: 0 };
}
renderVals() {
const t = this.state.tick * 0.1;
const { i, p } = this.pos();
const seg = this.SEGS[i];
const isAi = seg.who === 'ai';
const muted = this.state.muted;
const talking = p < 0.86;
const listeningMuted = !isAi && muted;
const list = seg.text.split(' ');
const shown = listeningMuted ? 0 : Math.ceil(Math.min(1, p / 0.86) * list.length);
// Rebond : niveau de la voix du tuteur (simulé ici), posé à chaque ponctuation.
const lastWord = list[Math.max(0, shown - 1)] || '';
const breath = /[.,!?:]$/.test(lastWord) ? 0.25 : 1;
const lively = (0.5 + 0.5 * Math.sin(t * 2.4)) * (0.6 + 0.4 * Math.sin(t * 0.9));
const hop = isAi && talking ? ((0.35 + 0.65 * lively) * breath).toFixed(2) : '0';
const tilt = !isAi && !muted ? '1' : '0';
let focus = null;
if (seg.focus && !listeningMuted) { const k = list.findIndex((w) => w.indexOf(seg.focus.from) === 0); if (k >= 0 && shown > k) focus = seg.focus.name; }
const g = {
wR: focus === 'rouge' ? 5 : 3, glowR: focus === 'rouge' ? 1 : 0,
wB: focus === 'bleu' ? 4 : 2.5, glowB: focus === 'bleu' ? 1 : 0,
haloR: (isAi && talking) || focus === 'point' ? 8 : 0,
lgR: focus === 'rouge' ? '#FFEBEB' : 'transparent',
lgB: focus === 'bleu' ? '#EBF1FF' : 'transparent',
lgP: focus === 'point' ? '#FFEBEB' : 'transparent'
};
const COL = ['#FFFFFF', 'rgba(255,255,255,0.45)'];
const words = listeningMuted
? [{ t: 'Réactive ton micro pour répondre.', c: COL[0], c2: COL[0], fw: 500, bg: 'transparent', pad: '0', sp: '' }]
: list.map((w, j) => {
const on = j < shown;
const tone = /^rouge/.test(w) ? '#E62E2E' : (/^bleue/.test(w) ? '#2E6BE6' : null);
const core = tone ? w.replace(/[,.]$/, '') : w;
const c = on ? COL[0] : COL[1];
return { t: core, sp: w.slice(core.length) + ' ', c: tone && on ? '#FFFFFF' : c, c2: c, fw: /[0-9=÷×]/.test(w) || tone ? 700 : 500, bg: tone && on ? tone : 'transparent', pad: tone ? '0 6px' : '0' };
});
const secs = 187 + Math.floor(this.state.tick / 10);
return {
hop, tilt, words, g, 
statusEtat: listeningMuted ? 'coupe' : (isAi ? 'explique' : 'ecoute'),
couleurEcoute: this.props.couleurEcoute ?? 'rouge',
speaker: isAi ? 'Tutor’IA' : 'Toi',
avatarLabel: isAi ? 'Interrompre Tutor’IA' : 'Tutor’IA t’écoute',
timer: String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'),
showCaptions: this.state.captions,
muted, camOn: this.state.cam,
interrupt: () => {
if ((this.props.etat ?? 'auto') !== 'auto' || !isAi) return;
this.setState({ offset: this.state.offset + (1 - p) * seg.dur });
},
toggleMute: () => this.setState({ muted: !this.state.muted }),
toggleCaptions: () => this.setState({ captions: !this.state.captions }),
toggleCam: () => this.setState({ cam: !this.state.cam })
};
}
}
</script>
