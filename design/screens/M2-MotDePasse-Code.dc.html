<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { show: false, pw: '', cgu: true, news: true, ok: true, hop: 0 }; }
renderVals() {
const s = this.state;
const pw = s.pw || '';
const rules = [['8 caractères', pw.length >= 8], ['Un chiffre', /\d/.test(pw)], ['Une majuscule', /[A-Z]/.test(pw)]]
.map(([label, ok]) => ({ label, color: ok ? '#03702B' : '#5D677D', bg: ok ? '#EBFFF2' : '#EEF1F6', dot: ok ? '#0C9E42' : '#B7BFCD' }));
const bd = (on) => on ? '2px solid #2E6BE6' : '2px solid #CED4E2';
const bx = (on) => on ? '#2E6BE6' : '#FFFFFF';
return {
pw, pwType: s.show ? 'text' : 'password', show: s.show, hide: !s.show,
pwLabel: s.show ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
togglePw: () => this.setState({ show: !s.show }),
setPw: (e) => this.setState({ pw: e.target.value }),
rules,
ck_cgu: s.cgu, bd_cgu: bd(s.cgu), bx_cgu: bx(s.cgu), tg_cgu: () => this.setState({ cgu: !s.cgu }),
ck_news: s.news, bd_news: bd(s.news), bx_news: bx(s.news), tg_news: () => this.setState({ news: !s.news }),
ck_ok: s.ok, bd_ok: bd(s.ok), bx_ok: bx(s.ok), tg_ok: () => this.setState({ ok: !s.ok }),
hop: s.hop
};
}
