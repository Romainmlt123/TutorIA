<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Flashcards · Choix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Black.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}
:root{--bg:#F5F8FF;--surface:#FFFFFF;--text:#000612;--text-secondary:#5D677D;--text-disabled:#798398;--icon:#798398;--border:#CED4E2;--primary:#2E6BE6;--primary-hover:#1750C4;--primary-soft:#EBF1FF;--accent:#662EE6;--accent-soft:#F1EBFF;--success:#0C9E42;--success-strong:#03702B;--success-soft:#EBFFF2;--warning:#A3640D;--warning-strong:#6E4204;--warning-soft:#FFF7EB;--error:#E62E2E;--error-strong:#C21A1A;--radius-2xl:16px;--radius-3xl:24px;--shadow-sm:0 1px 2px rgba(9,17,34,0.06);--shadow-md:0 4px 16px rgba(9,17,34,0.06);--shadow-lg:0 12px 32px rgba(9,17,34,0.10);--shadow-brand:0 8px 20px rgba(46,107,230,0.25);--shadow-focus:0 0 0 3px rgba(46,107,230,0.35);--font-sans:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;font-family:var(--font-sans);background:#F5F8FF;color:#000612}
a{color:#2E6BE6}a:hover{color:#1750C4}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1420px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); color: var(--text)">
<section aria-label="Flashcards" style="position: relative; overflow: hidden; padding: 56px 20px 88px; border-radius: 0 0 32px 32px; background: linear-gradient(170deg, #2E6BE6 0%, #1750C4 55%, #0A3B9D 100%); color: #FFFFFF">
<span aria-hidden="true" style="position: absolute; top: 20px; right: 96px; width: 104px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.06)"></span>
<span aria-hidden="true" style="position: absolute; top: 116px; right: -40px; width: 128px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08)"></span>
<header style="position: relative; display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 900; color: #FFFFFF">Flashcards</h1></div>
<button type="button" aria-label="Réglages des révisions" style="width: 48px; height: 48px; border: none; border-radius: var(--radius-2xl); background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
</button>
</header>
</section>

<main style="position: relative; display: flex; flex-direction: column; gap: 16px; margin-top: -56px; padding: 0 20px; box-sizing: border-box">

<section aria-label="Révision du jour" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--surface); border-radius: var(--radius-3xl); box-shadow: var(--shadow-md)">
<div style="position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 999px; background: #FFF7EB"></div>
<div style="position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 700">Révision du jour</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--text-secondary)">30 cartes à revoir · ~12 min</p>
</div>
<span style="display: flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: #E6992E; color: #FFFFFF; font-size: 14px; line-height: 20px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2.5c1 3.2 5.5 5.6 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.2-4.9 0 2.1 1 3.3 2.1 3.3 0-3.3-1-5.4 1.2-8.9z"></path></svg>
12
</span>
</div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<div aria-label="Maths, Histoire-Géo, Anglais et 2 autres matières" style="display: flex; align-items: center">
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFFFFF; background: linear-gradient(160deg, #E95555 0%, #C21A1A 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"></path></svg></span>
<span style="margin-left: -10px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFFFFF; background: linear-gradient(160deg, #1BC85B 0%, #03702B 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span>
<span style="margin-left: -10px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFFFFF; background: linear-gradient(160deg, #17A5BE 0%, #026273 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9M8.5 3v2M11 5c-1 4-3.5 7-7 8.5M6 8.5c1.5 2.5 3.5 4 6 5M13 21l4-9 4 9M14.5 18h5"></path></svg></span>
<span style="margin-left: -10px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFFFFF; background: #EBF1FF; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">+2</span>
</div>
<a href="03b-Flashcards-Session.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--radius-2xl); background: #662EE6; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 20px rgba(102,46,230,0.30)">
C'est parti
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</section>

<section aria-label="Matière" style="display: flex; flex-direction: column; gap: 16px; padding: 16px; background: var(--surface); border-radius: var(--radius-3xl); box-shadow: var(--shadow-md)">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 12px; row-gap: 2px">
<h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 900">Choisis ta matière</h2>
<span style="font-size: 12px; line-height: 16px; color: var(--text-secondary)">529 cartes en tout</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ subjects }}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.selected }}" style="position: relative; overflow: hidden; min-height: 120px; padding: 16px; box-sizing: border-box; border: none; border-radius: var(--radius-2xl); background: {{ s.bg }}; box-shadow: {{ s.shadow }}; color: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px; text-align: left; cursor: pointer">
<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: -20px; bottom: -20px; opacity: 0.16"><path d="{{ s.icon }}"></path></svg>
<span style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.24); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.icon }}"></path></svg>
</span>
<sc-if value="{{ s.selected }}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; color: {{ s.ink }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"></path></svg></span>
</sc-if>
<span style="display: flex; flex-direction: column">
<span style="font-size: 18px; line-height: 24px; font-weight: 900">{{ s.name }}</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500">{{ s.count }} cartes</span>
</span>
</button>
</sc-for>
</div>
</section>

<section aria-label="Chapitre" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border-radius: var(--radius-3xl); box-shadow: var(--shadow-md)">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 12px; row-gap: 2px; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 900">Chapitres · {{ subjectName }}</h2>
<span style="font-size: 12px; line-height: 16px; color: var(--text-secondary)">Programme de 4e</span>
</div>
<sc-for list="{{ chapters }}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.selected }}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 16px; box-sizing: border-box; border-radius: var(--radius-2xl); border: {{ c.border }}; background: {{ c.bg }}; text-align: left; color: var(--text); cursor: pointer">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: var(--radius-2xl); background: {{ c.soft }}; color: {{ c.ink }}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{ c.num }}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 24px; font-weight: 700">{{ c.t }}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; color: var(--text-secondary)">{{ c.n }} cartes · ~{{ c.min }} min</span>
</span>
<span aria-hidden="true" style="flex-shrink: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: {{ c.radioBorder }}; background: var(--surface)"></span>
</button>
</sc-for>
</section>

<a href="03b-Flashcards-Session.dc.html" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: var(--radius-2xl); background: var(--primary); color: #FFFFFF; font-size: 16px; font-weight: 500; text-decoration: none; box-shadow: var(--shadow-brand)">
Commencer · {{ startN }} cartes
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</main>

<div style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 72px; z-index: 5">
<dc-import name="../components/BottomNav" espace="eleve" active="revisions" hint-size="350px,72px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { s: 0, c: { 0: 0 } };
}
renderVals() {
const data = [
{ name: 'Maths', count: 120, bg: 'linear-gradient(160deg, #E95555 0%, #C21A1A 60%, #980B0B 100%)', ink: '#C21A1A', soft: '#FFEBEB', icon: 'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01', ch: [['Équations du 1er degré', 12, 6], ['Calcul littéral', 18, 9], ['Théorème de Pythagore', 10, 5], ['Puissances', 14, 7]] },
{ name: 'Français', count: 85, bg: 'linear-gradient(160deg, #4D81EA 0%, #1750C4 60%, #0A3B9D 100%)', ink: '#1750C4', soft: '#EBF1FF', icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5', ch: [['Accord du participe passé', 16, 8], ['Les figures de style', 12, 6], ['Le récit fantastique', 10, 5], ['Les subordonnées', 14, 7]] },
{ name: 'Histoire-Géo', count: 92, bg: 'linear-gradient(160deg, #1BC85B 0%, #0C9E42 45%, #03702B 100%)', ink: '#03702B', soft: '#EBFFF2', icon: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18', ch: [['La Révolution française', 20, 10], ['L’Empire napoléonien', 12, 6], ['L’urbanisation du monde', 10, 5], ['Les mobilités humaines', 14, 7]] },
{ name: 'Anglais', count: 110, bg: 'linear-gradient(160deg, #17A5BE 0%, #09879D 45%, #026273 100%)', ink: '#026273', soft: '#EBFCFF', icon: 'M4 5h9M8.5 3v2M11 5c-1 4-3.5 7-7 8.5M6 8.5c1.5 2.5 3.5 4 6 5M13 21l4-9 4 9M14.5 18h5', ch: [['Le prétérit simple', 15, 7], ['Les comparatifs', 10, 5], ['Vocabulaire : le voyage', 24, 10], ['Le present perfect', 12, 6]] },
{ name: 'SVT', count: 64, bg: 'linear-gradient(160deg, #A3640D 0%, #6E4204 65%, #3D2400 100%)', ink: '#6E4204', soft: '#FFF7EB', icon: 'M5 19c0-8 5-14 15-15-1 10-7 15-15 15zM5 19l8-8', ch: [['La digestion', 14, 7], ['La reproduction humaine', 16, 8], ['Séismes et volcans', 12, 6], ['Le système nerveux', 10, 5]] },
{ name: 'Physique-Chimie', count: 58, bg: 'linear-gradient(160deg, #8558EA 0%, #521DC8 60%, #3B0DA2 100%)', ink: '#521DC8', soft: '#F1EBFF', icon: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9', ch: [['La masse volumique', 10, 5], ['Les circuits électriques', 16, 8], ['Atomes et molécules', 14, 7], ['La combustion', 12, 6]] }
];
const si = this.state.s;
const ci = this.state.c[si] ?? 0;
const cur = data[si];
const subjects = data.map((d, i) => {
const sel = i === si;
return {
name: d.name, count: d.count, bg: d.bg, icon: d.icon, ink: d.ink, selected: sel,
shadow: sel ? '0 0 0 3px #FFFFFF, 0 0 0 6px ' + d.ink : '0 1px 2px rgba(9,17,34,0.06)',
pick: () => this.setState({ s: i })
};
});
const chapters = cur.ch.map((c, j) => {
const sel = j === ci;
return {
t: c[0], n: c[1], min: c[2], num: String(j + 1).padStart(2, '0'), selected: sel,
soft: cur.soft, ink: cur.ink,
border: sel ? '2px solid ' + cur.ink : '2px solid #F5F8FF',
bg: sel ? '#FFFFFF' : '#F5F8FF',
radioBorder: sel ? '7px solid ' + cur.ink : '2px solid #798398',
pick: () => this.setState({ c: Object.assign({}, this.state.c, { [si]: j }) })
};
});
return { subjects, chapters, subjectName: cur.name, startN: cur.ch[ci][1] };
}
}
</script>
</body>
</html>
