<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../assets/typographie/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Black.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}
:root{--bg:#F5F8FF;--surface:#FFFFFF;--text:#000612;--text-secondary:#5D677D;--primary:#2E6BE6;--primary-soft:#EBF1FF;--accent:#662EE6;--error:#E62E2E;--error-strong:#C21A1A;--radius-2xl:16px;--radius-3xl:24px;--shadow-sm:0 1px 2px rgba(9,17,34,0.06);--shadow-md:0 4px 16px rgba(9,17,34,0.06);--shadow-lg:0 12px 32px rgba(9,17,34,0.10);--shadow-focus:0 0 0 3px rgba(46,107,230,0.35);--font-sans:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;font-family:var(--font-sans);background:#0A3B9D;color:#FFFFFF}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,0.7)}
@keyframes halo{0%{transform:scale(0.6);opacity:0.55}100%{transform:scale(2.2);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
@keyframes pen{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
.pen{display:inline-block;flex-shrink:0;width:8px;height:8px;border-radius:999px;background:#2E6BE6;box-shadow:0 0 0 3px rgba(46,107,230,.22);animation:pen 1s ease-in-out infinite;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.halo,.pen{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(170deg, #2E6BE6 0%, #1750C4 42%, #0A3B9D 78%, #03276E 100%); font-family: var(--font-sans); color: #FFFFFF">
<div style="position: absolute; top: 56px; left: 20px; right: 20px; height: 44px">
<dc-import name="../components/CallTopBar" fond="transparent" timer="{{ timer }}" ecrit-href="02a-Tuteur-Ecrit.dc.html" hint-size="350px,44px"></dc-import>
</div>
<div style="position: absolute; top: 120px; left: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #FFFFFF">
<span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(160deg, #E95555 0%, #C21A1A 60%, #980B0B 100%); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 7h8v3H8zM8.5 14h.01M12 14h.01M15.5 14h.01M8.5 17.5h.01M12 17.5h.01M15.5 17.5h.01"></path></svg></span>
Maths</span>
<h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 900; color: #FFFFFF">Équations du 1er degré</h1>
</div>
<div style="position: absolute; left: 97px; top: 230px">
<dc-import name="../components/VoiceAvatar" fond="transparent" size="148" hop="{{ hop }}" tilt="{{ tilt }}" label="{{ avatarLabel }}" on-interrupt="{{ interrupt }}" hint-size="196px,184px"></dc-import>
</div>
<div style="position: absolute; top: 436px; left: 0; right: 0; display: flex; justify-content: center">
<dc-import name="../components/VoiceStatus" fond="transparent" etat="{{ statusEtat }}" couleur-ecoute="{{ couleurEcoute }}" hint-size="180px,40px"></dc-import>
</div>
<sc-if value="{{ showCaptions }}" hint-placeholder-val="{{ true }}">
<section aria-label="Sous-titres" style="position: absolute; top: 508px; left: 28px; right: 28px; height: 150px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.8)">{{ speaker }}</span>
<p style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 500; text-wrap: pretty"><sc-for list="{{ words }}" as="w" hint-placeholder-count="10"><span style="color: {{ w.c }}; font-weight: {{ w.fw }}; background: {{ w.bg }}; padding: {{ w.pad }}; border-radius: 6px; transition: color 0.2s, background 0.2s">{{ w.t }}</span><span style="color: {{ w.c2 }}">{{ w.sp }}</span></sc-for></p>
</section>
</sc-if>
<div style="position: absolute; left: 20px; right: 20px; bottom: 32px">
<dc-import name="../components/CallDock" fond="transparent" muted="{{ muted }}" captions="{{ showCaptions }}" cam-on="{{ camOn }}" on-mute="{{ toggleMute }}" on-captions="{{ toggleCaptions }}" on-cam="{{ toggleCam }}" hangup-href="02a-Tuteur-Ecrit.dc.html" hint-size="350px,112px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["auto","parle","ecoute"],"default":"auto"},"couleurEcoute":{"editor":"enum","options":["rouge","orange"],"default":"rouge"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tick: 0, offset: 4, muted: false, cam: false, captions: true };
this.SEGS = [{"who": "user", "text": "J’enlève 5 des deux côtés, ça donne 3x = 15.", "dur": 4}, {"who": "ai", "text": "Bien joué, c’est exactement ça ! On arrive à 3x = 15. Et maintenant, comment tu trouves x ?", "dur": 8}, {"who": "user", "text": "Je fais 15 moins 3, donc x = 12.", "dur": 4}, {"who": "ai", "text": "Presque ! Regarde bien l’étape d’avant. Dans 3x, le 3 multiplie x. Quelle opération défait une multiplication ?", "dur": 9}, {"who": "user", "text": "Une division ! Donc x = 15 ÷ 3, x = 5.", "dur": 4.5}, {"who": "ai", "text": "Exactement, x = 5 ! Tu veux vérifier en remplaçant x dans l’équation de départ ?", "dur": 7}];
}
componentDidMount() {
this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
pos() {
const etat = this.props.etat ?? 'auto';
if (etat === 'parle') return { i: 3, p: 0.5 + 0.0001 * (this.state.tick % 2) };
if (etat === 'ecoute') return { i: 4, p: 0.6 };
const total = this.SEGS.reduce((s, x) => s + x.dur, 0);
let t = (this.state.tick * 0.1 + this.state.offset) % total;
for (let i = 0; i < this.SEGS.length; i++) {
if (t < this.SEGS[i].dur) return { i, p: t / this.SEGS[i].dur };
t -= this.SEGS[i].dur;
}
return { i: 0, p: 0 };
}
renderVals() {
const t = this.state.tick * 0.1;
const { i, p } = this.pos();
const seg = this.SEGS[i];
const isAi = seg.who === 'ai';
const muted = this.state.muted;
const talking = p < 0.86;
const listeningMuted = !isAi && muted;
const list = seg.text.split(' ');
const shown = listeningMuted ? 0 : Math.ceil(Math.min(1, p / 0.86) * list.length);
// Rebond : niveau de la voix du tuteur (simulé ici), posé à chaque ponctuation.
const lastWord = list[Math.max(0, shown - 1)] || '';
const breath = /[.,!?:]$/.test(lastWord) ? 0.25 : 1;
const lively = (0.5 + 0.5 * Math.sin(t * 2.4)) * (0.6 + 0.4 * Math.sin(t * 0.9));
const hop = isAi && talking ? ((0.35 + 0.65 * lively) * breath).toFixed(2) : '0';
const tilt = !isAi && !muted ? '1' : '0';

const COL = ['#FFFFFF', 'rgba(255,255,255,0.45)'];
const words = listeningMuted
? [{ t: 'Réactive ton micro pour répondre.', c: COL[0], c2: COL[0], fw: 500, bg: 'transparent', pad: '0', sp: '' }]
: list.map((w, j) => {
const on = j < shown;
const tone = /^rouge/.test(w) ? '#E62E2E' : (/^bleue/.test(w) ? '#2E6BE6' : null);
const core = tone ? w.replace(/[,.]$/, '') : w;
const c = on ? COL[0] : COL[1];
return { t: core, sp: w.slice(core.length) + ' ', c: tone && on ? '#FFFFFF' : c, c2: c, fw: /[0-9=÷×]/.test(w) || tone ? 700 : 500, bg: tone && on ? tone : 'transparent', pad: tone ? '0 6px' : '0' };
});
const secs = 134 + Math.floor(this.state.tick / 10);
return {
hop, tilt, words, 
statusEtat: listeningMuted ? 'coupe' : (isAi ? 'explique' : 'ecoute'),
couleurEcoute: this.props.couleurEcoute ?? 'rouge',
speaker: isAi ? 'Tutor’IA' : 'Toi',
avatarLabel: isAi ? 'Interrompre Tutor’IA' : 'Tutor’IA t’écoute',
timer: String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'),
showCaptions: this.state.captions,
muted, camOn: this.state.cam,
interrupt: () => {
if ((this.props.etat ?? 'auto') !== 'auto' || !isAi) return;
this.setState({ offset: this.state.offset + (1 - p) * seg.dur });
},
toggleMute: () => this.setState({ muted: !this.state.muted }),
toggleCaptions: () => this.setState({ captions: !this.state.captions }),
toggleCam: () => this.setState({ cam: !this.state.cam })
};
}
}
</script>
</body>
</html>
